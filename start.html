<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>格线战争 Release v1.1 Hotfix</title>
    <link rel="stylesheet" href="style.css">
    <!-- ★ 已彻底移除 peerjs.min.js，纯原生 WebRTC 不需要它 -->
</head>
<body>
    <!-- ★ 酷炫启动界面 -->
    <div id="splash-screen">
        <div class="splash-text splash-title">GRIDLINE WAR</div>
        <div class="splash-text splash-credit">Game Design: Jason Lee at Class 9</div>
        <div class="splash-text splash-credit2">Code Implementation: Jimmy Lee at Class 9</div>
        <div class="splash-thanks">Thanks to JetBrains s.r.o. & Deno</div>
    </div>

    <div id="start-screen" class="overlay">
        <div class="modal"><h1>格线战争</h1>
            <p>按规则说明书实现</p>

            <label>地图 <select id="map-size">
                <option value="20">20 × 20</option>
                <option value="24">24 × 24</option>
                <option value="40" selected>40 × 30</option>
            </select></label>

            <label>对手 <select id="ai-select" onchange="togglePeerPanel()">
                <option value="PVP">本地双人 PvP</option>
                <option value="EASY">简单 AI</option>
                <option value="HARD">困难 AI</option>
                <option value="MASTER">大师 AI</option>
                <option value="PEER">P2P 联机 (WebRTC)</option>
            </select></label>

            <label>回合数限制 <input type="number" id="turn-limit" value="0" min="0" style="padding: 7px; border-radius: 5px; border: none; width: 80px; margin-left: 8px;"> (0为无限制)</label>

            <!-- 联机专用面板，默认隐藏 -->
            <div id="peer-panel" style="display:none; margin-top: 15px; background: #2c3e50; padding: 15px; border-radius: 8px;">
                <div style="margin-bottom: 10px;">
                    <button class="btn-main" onclick="createOnlineRoom()" style="background:#2ecc71; margin: 0; width: 100%;">创建房间 (作为房主)</button>
                </div>
                <div style="display:flex; gap:10px; justify-content:center;">
                    <input type="text" id="input-room-id" placeholder="输入房间号" style="padding: 8px; border-radius: 5px; border: none; width: 120px; text-transform: uppercase;">
                    <button class="btn-main" onclick="joinOnlineRoom()" style="margin:0; width:auto; background:#e67e22; padding: 8px 15px;">加入房间</button>
                </div>
                <div id="net-status" style="margin-top: 10px; color: #f1c40f; font-size: 14px; min-height: 20px;"></div>
            </div>

            <div id="game-start-buttons" style="margin-top: 20px;">
                <button class="btn-main" onclick="startGame('CLASSIC')">经典规则</button>
                <button class="btn-main advanced" onclick="startGame('ADVANCED')">进阶变异体</button>
            </div>

            <!-- 规则书按钮 (主菜单) -->
            <button class="btn-main" onclick="window.open('rule.html', '_blank')" style="background: #8e44ad; margin-top: 10px;">📖 官方规则书</button>
        </div>
    </div>

    <div id="game-over-screen" class="overlay" style="display:none">
        <div class="modal"><h1 id="winner-title">游戏结束</h1>
            <p id="winner-reason"></p>
            <button class="btn-main" onclick="location.reload()">再来一局</button>
        </div>
    </div>

    <div class="game-layout">
        <aside class="control-panel"><h1>格线战争</h1>
            <div class="status">
                <p>当前玩家: <span id="player-display" class="p1-color">蓝色 (P1)</span></p>
                <p id="turn-display" style="font-size: 13px; color: #aaa;"></p>
            </div>
            <h3>操作</h3>
            <div class="actions">
                <button id="btn-grow-trunk" class="action-btn disabled" disabled>🌱 长主干（最多3格）</button>
                <button id="btn-grow-soldier" class="action-btn disabled" disabled>⚔️ 移动/延伸分支</button>
                <button id="btn-attack" class="action-btn disabled" disabled>💥 攻击</button>
                <button id="btn-disable" class="action-btn disabled" disabled>🦠 病毒禁用分支</button>
                <button id="btn-grow-tumor" class="action-btn disabled" disabled>⊗ 分化肿瘤</button>
                <button id="btn-pass" class="action-btn disabled" disabled>⏭️ 结束行动</button>
            </div>
            <div id="variant-panel" class="variant-panel" style="display:none"><label>新分支变异体<select
                    id="variant-select">
                <option value="0">普通</option>
                <option value="1">噬体</option>
                <option value="2">病毒</option>
                <option value="3">晶体</option>
                <option value="4">基因</option>
                <option value="5">炸弹</option>
                <option value="6">禁</option>
            </select></label></div>
            <div class="hint"><p id="hint-text"></p>
                <p id="hint-hover"></p>
                <p id="hint-msg"></p></div>
            <div class="log-header"><span>系统控制台</span>
                <button class="btn-clear" onclick="document.getElementById('log-box').innerHTML=''">清空</button>
            </div>
            <div id="log-box" class="log-container"></div>
            <div class="minimap-wrapper">
                <canvas id="miniMapCanvas"></canvas>
            </div>
            <!-- 游戏内操作按钮 -->
            <button class="btn-restart" onclick="location.reload()">重新开始</button>
            <button class="btn-restart" onclick="window.open('rule.html', '_blank')" style="background: #8e44ad; margin-top: 5px;">📖 查阅官方规则书</button>
        </aside>
        <main class="canvas-container">
            <canvas id="gameCanvas"></canvas>
        </main>
    </div>
    
    <script>
        // 控制启动界面在 4.5 秒后淡出并移除
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.classList.add('fade-out');
                setTimeout(() => splash.remove(), 1000);
            }
        }, 4500);
    </script>
    <script src="Game.js"></script>
</body>
</html>
